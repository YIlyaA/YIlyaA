# Generates the contribution-graph snake and pushes it to the `output` branch.
#
# The README reads it from that branch, so nothing here touches `main` except
# this file. Colours are the profile's own: the snake is the accent, and the
# contribution cells run from the page black up to the same accent, so the
# animation belongs to the rest of the page instead of arriving in GitHub green.
#
# First run: Actions > snake > Run workflow. After that it refreshes twice a day.

name: snake

on:
  schedule:
    - cron: "0 2,14 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%23FF6B00&color_dots=%2315171C,%234A2A0C,%238A4A10,%23C25706,%23FF6B00

      - name: Push it to the output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
